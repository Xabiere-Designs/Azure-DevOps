trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: "SECURE_TOKENS"
- name: snyk_token
  value: $(SNYKTOKEN)

steps:
- script: |
    snyk_token=$(SNYKTOKEN) 
    export SNYK_TOKEN
    mvn snyk:test -fn
  displayName: "Integrate SCA using Snyk in AZURE DevOps DevSecOps Pipeline" 
  env:
    # map ADO secrets to env vars Snyk/Maven plugin reads
    SNYK_TOKEN: $(SNYKTOKEN)
    SNYK_ORG:   $(SNYK_ORG)
