trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: SECURE_TOKENS  # SNYKTOKEN, SNYK_ORG

steps:
- bash: |
    set -euo pipefail

    # Quick sanity checks so we fail fast if secrets don't flow
    [ -n "${SNYKTOKEN:-}" ] || { echo "Missing SNYKTOKEN"; exit 1; }
    [ -n "${SNYK_ORG:-}" ]  || { echo "Missing SNYK_ORG";  exit 1; }

    # Install Snyk CLI
    curl -sL https://static.snyk.io/cli/latest/snyk-linux -o snyk
    chmod +x snyk && sudo mv snyk /usr/local/bin/snyk
    snyk --version

    # Authenticate the CLI (401s disappear here if token is valid)
    snyk auth "$SNYKTOKEN"

    # Run the Maven plugin and pass org+token explicitly
    mvn -B io.snyk:snyk-maven-plugin:2.0.0:test \
       -Dsnyk.token="$SNYKTOKEN" \
       -Dsnyk.organization="$SNYK_ORG" \
       -DfailOnSeverity=high
  displayName: "Integrate SCA using Snyk (Maven)"
  env:
    SNYKTOKEN: $(SNYKTOKEN)
    SNYK_ORG:  $(SNYK_ORG)
