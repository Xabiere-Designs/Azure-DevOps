trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: SECURE_TOKENS     # must contain a secret named SNYKTOKEN
- name: snyk_token
  value: $[variables.SNYKTOKEN]   # compile-time expansion -> creates $(snyk_token)

steps:
- script: |
    # Export token so the plugin/CLI sees it
    SNYK_TOKEN="$(snyk_token)"
    export SNYK_TOKEN

    # Run Snyk via the Maven plugin (works with your pom.xml)
    mvn -B io.snyk:snyk-maven-plugin:2.0.0:test \
      -Dsnyk.organization="xabiere-designs" \
      -DfailOnSeverity=high \
      -fn
  displayName: "Integrate SCA scan using Snyk in ADO DevSecOps Pipeline"
